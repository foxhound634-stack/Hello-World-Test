name: Build APK

on:
  workflow_dispatch: # This creates the "Run" button for you

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Generate App & Compile
        run: |
          flutter create test_app
          cp main.dart test_app/lib/main.dart
          cd test_app
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HelloWorld-APK
          path: test_app/build/app/outputs/flutter-apk/app-release.apk
